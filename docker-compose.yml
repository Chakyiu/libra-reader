# Libra Reader. The published port is loopback only: the app has no login.
#
#   docker compose up --build
#   open http://localhost:3000
#
# Data lives in the libra-reader-data volume, separate from the ./data folder used by
# `npm run dev`. LIBRA_SEED=0 starts with an empty library. LIBRA_SEED=1 (the
# default) adds the sample library only when the database is empty.
#
# The greeting uses the container clock, which is UTC unless you set TZ:
#   TZ=Asia/Hong_Kong docker compose up
#
# To keep the files on the host instead, stop `npm run dev` and replace the
# volume below with:  - ./data:/data

services:
  libra-reader:
    build: .
    image: libra-reader
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/data/libra.db
      LIBRA_STORAGE_DIR: /data/uploads
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      LIBRA_SEED: ${LIBRA_SEED:-1}
      TZ: ${TZ:-UTC}
    volumes:
      - libra-reader-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  libra-reader-data:
