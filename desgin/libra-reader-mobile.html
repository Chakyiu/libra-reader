<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libra Reader — mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.979 0.003 85);
  --surface:oklch(0.960 0.004 100);
  --fg:oklch(0.205 0.013 76);
  --muted:oklch(0.505 0.009 75);
  --border:oklch(0.900 0.005 95);
  --accent:oklch(0.514 0.083 29);
  --accent-ink:oklch(0.985 0.003 85);
  /* darkened accent for labels that sit on an accent tint */
  --accent-text:oklch(0.455 0.088 29);
  /* primary actions are ink, not accent — accent stays reserved for the mark and small indicators */
  --primary:oklch(0.199 0.0155 76);
  --primary-hover:oklch(0.290 0.016 76);
  --primary-ink:oklch(0.979 0.003 85);
  --err:oklch(0.505 0.175 16);
  --warn:oklch(0.640 0.135 54);
  --well:oklch(0.970 0.003 92);
  --hl-yellow:oklch(0.925 0.080 96);
  --hl-sage:oklch(0.908 0.044 152);
  --hl-blue:oklch(0.908 0.040 238);
  --hl-blush:oklch(0.908 0.042 10);
  --shadow-pop:0 1px 2px color-mix(in oklab,var(--fg) 8%,transparent),0 14px 34px color-mix(in oklab,var(--fg) 14%,transparent);
  --serif:"Newsreader","Iowan Old Style","Source Serif 4",Georgia,serif;
  --sans:"Archivo",-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-sm:8px; --r-md:14px;
}
[data-theme="dark"]{
  --bg:oklch(0.198 0.005 75);
  --surface:oklch(0.246 0.005 75);
  --fg:oklch(0.932 0.005 85);
  --muted:oklch(0.745 0.007 80);
  --border:oklch(0.345 0.005 75);
  --accent:oklch(0.730 0.075 38);
  --accent-ink:oklch(0.185 0.012 40);
  --accent-text:oklch(0.775 0.072 38);
  --primary:oklch(0.730 0.075 38);
  --primary-hover:oklch(0.790 0.072 38);
  --primary-ink:oklch(0.185 0.012 40);
  --err:oklch(0.700 0.150 20);
  --warn:oklch(0.780 0.120 60);
  --well:oklch(0.225 0.005 75);
  --hl-yellow:oklch(0.47 0.072 96);
  --hl-sage:oklch(0.44 0.046 152);
  --hl-blue:oklch(0.44 0.044 248);
  --hl-blush:oklch(0.45 0.050 10);
  --shadow-pop:0 1px 2px rgba(0,0,0,.4),0 16px 36px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--fg);
  background:oklch(0.905 0.004 95);display:grid;place-items:center;padding:28px;-webkit-font-smoothing:antialiased}
[data-theme="dark"] body{background:oklch(0.140 0.004 75)}
button{background:none;border:0;cursor:pointer;font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.caps{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ico{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:17px;height:17px}

/* device */
.phone{position:relative;width:390px;height:844px;background:var(--bg);border-radius:46px;overflow:hidden;
  border:1px solid color-mix(in oklab,var(--fg) 22%,transparent);box-shadow:0 40px 90px rgba(0,0,0,.26)}
.statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 30px 7px;font-size:13px;font-weight:600;z-index:40;pointer-events:none;
  background:linear-gradient(var(--bg) 62%,transparent)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:30px;border-radius:16px;
  background:oklch(0.140 0.004 75);z-index:41}
.screenwrap{position:absolute;inset:52px 0 84px;overflow:auto;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.screenwrap{scroll-behavior:auto}}
.screen{display:none;padding:12px 22px 40px}
.screen.on{display:block}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:132px;height:5px;border-radius:3px;
  background:color-mix(in oklab,var(--fg) 34%,transparent);z-index:45;pointer-events:none}

/* bottom nav */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;z-index:38;display:grid;
  grid-template-columns:repeat(5,1fr);align-items:start;padding:8px 6px 0;
  background:color-mix(in oklab,var(--bg) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--border)}
.tab{display:grid;justify-items:center;gap:5px;padding:9px 4px;border-radius:12px;color:var(--muted);min-height:54px}
.tab span{font-size:11.5px;font-weight:500;letter-spacing:.01em;line-height:1.2}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] span{font-weight:600}
.fab{display:grid;place-items:center;width:52px;height:52px;border-radius:17px;justify-self:center;margin-top:-1px;
  background:var(--primary);color:var(--primary-ink);
  box-shadow:0 2px 0 color-mix(in oklab,var(--fg) 26%,transparent),0 8px 20px color-mix(in oklab,var(--primary) 36%,transparent)}
.fab:active{transform:translateY(2px);box-shadow:none}

/* shared bits */
.appbar{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.appbar h1{margin:0;font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.022em;line-height:1.2}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:var(--muted)}
.iconbtn:active{background:color-mix(in oklab,var(--fg) 9%,transparent)}
.iconbtn.on{color:var(--accent)}
.iconbtn.on svg{fill:currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 18px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--bg);font-size:14px;font-weight:500;line-height:1.2;min-height:48px}
.btn.prime{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:600;
  box-shadow:0 1px 0 color-mix(in oklab,var(--fg) 22%,transparent)}
.btn.prime:active{transform:translateY(1px);box-shadow:none}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:999px;line-height:1.2;
  border:1px solid var(--border);background:var(--bg);font-size:13px;font-weight:500;color:var(--muted);min-height:40px}
.chip.tag{border-style:dashed}
.chip[aria-pressed="true"],.chip.on{background:color-mix(in oklab,var(--accent) 14%,transparent);
  border-color:color-mix(in oklab,var(--accent) 36%,transparent);color:var(--accent-text);border-style:solid}
.swatch{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid color-mix(in oklab,var(--fg) 24%,transparent)}
.field{display:flex;align-items:center;gap:11px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--well);color:var(--muted);min-height:50px}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);padding:0}
.field input::placeholder{color:var(--muted)}
.scroller{display:flex;gap:9px;overflow-x:auto;margin:0 -22px;padding:2px 22px 14px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}

/* bookplate */
.plate{position:relative;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex:none;padding:12px;
  background:var(--pbg,var(--surface));display:grid;place-items:center;text-align:center}
.plate .frame{position:absolute;inset:5px;border:1px solid color-mix(in oklab,var(--fg) 18%,transparent);border-radius:3px}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in oklab,var(--fg) 4%,transparent) 3px 4px)}
.plate b{font-family:var(--serif);font-weight:500;line-height:1.1;color:color-mix(in oklab,var(--fg) 92%,transparent)}
.plate[data-t="newsletter"]{--pbg:color-mix(in oklab,var(--hl-yellow) 55%,var(--surface))}
.plate[data-t="pdf"]{--pbg:color-mix(in oklab,var(--hl-blush) 55%,var(--surface))}
.plate[data-t="epub"]{--pbg:color-mix(in oklab,var(--hl-blue) 55%,var(--surface))}
.plate[data-t="note"]{--pbg:color-mix(in oklab,var(--hl-sage) 55%,var(--surface))}

/* library list */
.item{position:relative;display:grid;grid-template-columns:58px minmax(0,1fr);gap:15px;align-items:start;
  padding:18px 4px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.item:active{background:color-mix(in oklab,var(--fg) 5%,transparent)}
.item .plate{width:58px;height:58px}
.item .plate b{font-size:17px}
.item h3{margin:0;font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.3;letter-spacing:-.01em}
.item .meta{display:block;margin-top:7px;font-size:12.5px;color:var(--muted);line-height:1.55}
.item .prog{display:flex;align-items:center;gap:10px;margin-top:11px}
.item .track{flex:1;height:3px;border-radius:2px;background:color-mix(in oklab,var(--fg) 14%,transparent);overflow:hidden}
.item .fill{height:100%;background:var(--accent);border-radius:2px}
.item .pct{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.hero{display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:var(--r-md);
  padding:22px;background:var(--well);margin-bottom:8px}
.hero .top{display:flex;gap:17px;align-items:center}
.hero .plate{width:78px;height:96px}
.hero .plate b{font-size:24px}
.hero h2{margin:9px 0 0;font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.016em;line-height:1.25}
.hero .prog{display:flex;align-items:center;gap:11px;margin-top:17px}
.hero .track{flex:1;height:3px;border-radius:2px;background:color-mix(in oklab,var(--fg) 14%,transparent);overflow:hidden}
.hero .fill{height:100%;background:var(--accent);border-radius:2px}
.hero .pct{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sec{margin-top:32px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
.sec-head h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec-head button{margin-left:auto;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px}

/* highlight cards */
.hcard{display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:var(--r-md);
  padding:22px;margin-bottom:14px;background:var(--bg)}
.hcard q{quotes:none;font-family:var(--serif);font-size:17px;line-height:1.6;display:block}
.hcard q em{font-style:normal;padding:2px 4px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hcard .note{margin:15px 0 0;padding-left:15px;border-left:2px solid color-mix(in oklab,var(--accent) 60%,transparent);
  font-size:13.5px;color:var(--muted);font-style:italic;line-height:1.6}
.hcard .src{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:17px;font-size:12.5px;color:var(--muted)}

/* reader */
#reader{padding:0}
.readtop{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;padding:8px 14px;
  background:color-mix(in oklab,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);
  transition:transform .22s ease,opacity .22s ease}
.readtop.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.readtop{transition:none}}
.readtop .sp{flex:1}
.readprog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent)}
.rbody{padding:24px 24px 72px}
.rhead{border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:28px}
.rhead h1{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.024em;line-height:1.18;margin:13px 0 0}
.rhead .by{margin-top:15px;font-size:12.5px;color:var(--muted);line-height:1.7}
.rhead .by a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in oklab,var(--accent) 40%,transparent);padding-bottom:3px}
.article{font-family:var(--read-font,var(--serif));font-size:var(--read-size,18px);line-height:var(--read-lead,1.74)}
.article[data-font="sans"]{--read-font:var(--sans)}
.article h2{font-family:var(--serif);font-size:1.3em;font-weight:600;letter-spacing:-.015em;line-height:1.28;margin:2em 0 .5em}
.article p{margin:0 0 1.15em}
.article p.drop::first-letter{font-size:3em;float:left;line-height:.84;padding:.06em .09em 0 0;font-weight:500}
.article blockquote{margin:1.6em 0;padding-left:22px;border-left:2px solid var(--accent);font-style:italic;color:var(--muted)}
mark.hl{background:var(--hl-yellow);color:var(--fg);padding:2px 4px;border-radius:3px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;border-bottom:1.5px solid transparent}
mark.hl[data-c="sage"]{background:var(--hl-sage)}
mark.hl[data-c="blue"]{background:var(--hl-blue)}
mark.hl[data-c="blush"]{background:var(--hl-blush)}
mark.hl[data-note="1"]{border-bottom-color:color-mix(in oklab,var(--fg) 55%,transparent)}
mark.hl.flash{animation:flash 1.5s ease}
@keyframes flash{0%,55%{box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 42%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){mark.hl.flash{animation:none;outline:2px solid var(--accent)}}
.endcap{margin-top:48px;padding-top:28px;border-top:1px solid var(--border);display:grid;gap:13px;
  font-family:var(--sans);font-size:13.5px;color:var(--muted);line-height:1.55}

/* selection toolbar */
.seltool{position:absolute;z-index:60;display:flex;align-items:center;gap:3px;padding:6px;border-radius:12px;
  background:var(--fg);box-shadow:var(--shadow-pop)}
.seltool[hidden]{display:none}
.seltool button{display:flex;align-items:center;gap:7px;padding:11px 14px;border-radius:7px;color:var(--bg);
  font-size:13px;font-weight:500;min-height:42px;line-height:1.2}
.seltool .dots{display:flex;gap:7px;padding:0 8px}
.seltool .dots button{width:22px;height:22px;min-height:0;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.5)}
.seltool .sepv{width:1px;height:22px;background:color-mix(in oklab,var(--bg) 32%,transparent);margin:0 4px}

/* sheets + toasts */
.veil{position:absolute;inset:0;z-index:50;background:color-mix(in oklab,oklch(0.20 0.012 76) 48%,transparent)}
.veil[hidden]{display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;background:var(--bg);border-radius:22px 22px 0 0;
  border-top:1px solid var(--border);box-shadow:var(--shadow-pop);max-height:82%;overflow:auto;
  animation:slideup .26s cubic-bezier(.22,1,.36,1)}
.sheet[hidden]{display:none}
@keyframes slideup{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grip{width:38px;height:4px;border-radius:3px;background:color-mix(in oklab,var(--fg) 24%,transparent);margin:11px auto 4px}
.sheet-head{display:flex;align-items:center;gap:12px;padding:12px 22px 15px;border-bottom:1px solid var(--border)}
.sheet-head h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.016em;line-height:1.3}
.sheet-body{padding:24px 22px}
.sheet-foot{display:flex;gap:11px;padding:18px 22px 30px;border-top:1px solid var(--border);background:var(--well)}
.ctl{display:grid;gap:10px;margin-bottom:22px}
.ctl label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.ctl label b{color:var(--fg);font-family:var(--mono);font-size:12px;font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.seg{display:flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--bg)}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 8px;
  font-size:13px;font-weight:500;color:var(--muted);min-height:48px;line-height:1.2}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent-text);font-weight:600}
.lbl{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:9px}
.inp{width:100%;padding:15px 16px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--well);outline:none;line-height:1.4}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
textarea.inp{min-height:112px;resize:none}
.optrow{display:flex;align-items:center;gap:14px;width:100%;padding:18px 4px;border-bottom:1px solid var(--border);text-align:left}
.optrow .t{flex:1;min-width:0}
.optrow b{display:block;font-size:14.5px;font-weight:500}
.optrow span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.snack{position:absolute;left:16px;right:16px;bottom:98px;z-index:58;display:flex;align-items:center;gap:12px;
  padding:16px 16px 16px 20px;border-radius:14px;background:var(--fg);color:var(--bg);box-shadow:var(--shadow-pop);
  font-size:13.5px;line-height:1.4;animation:rise .2s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.snack{animation:none}}
.snack button{color:var(--bg);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:7px 9px}
.empty{text-align:center;padding:60px 22px;border:1px dashed var(--border);border-radius:var(--r-md);margin-top:20px}
.empty .mark{width:32px;height:32px;color:var(--muted);margin-bottom:14px}
.empty h2{font-family:var(--serif);font-size:19px;font-weight:500;margin:0 0 9px;line-height:1.3}
.empty p{margin:0 auto 20px;color:var(--muted);max-width:30ch;font-size:13.5px;line-height:1.6}

.hint{max-width:390px;margin-top:22px;text-align:center;font-size:13px;color:oklch(0.405 0.008 75);line-height:1.65}
[data-theme="dark"] .hint{color:oklch(0.745 0.007 80)}
@media (max-width:460px){
  body{padding:0;display:block;background:var(--bg)}
  .phone{width:100%;height:100vh;border-radius:0;border:0;box-shadow:none}
  .hint{display:none}
}
</style>
</head>
<body>

<svg class="sr" aria-hidden="true"><defs>
<symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 7.2v12.1M8.3 20.8h7.4M12 7.2C10 5.6 6.6 5 3.4 5.5v9.4c3.2-.5 6.6.1 8.6 1.7M12 7.2c2-1.6 5.4-2.2 8.6-1.7v9.4c-3.2-.5-6.6.1-8.6 1.7M12 3.4v1.6"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.2 12 3.6l8.5 6.6V20a.8.8 0 0 1-.8.8h-4.4v-6.2H8.7v6.2H4.3a.8.8 0 0 1-.8-.8z"/></symbol>
<symbol id="i-lib" viewBox="0 0 24 24"><path d="M4 4.5h4v15H4zM10 4.5h4v15h-4zM16.2 5.4l3.6.9-3.3 13.3-3.6-.9z"/></symbol>
<symbol id="i-hl" viewBox="0 0 24 24"><path d="m13.4 4.6 6 6-7.6 7.6H5.8v-6z"/><path d="M4 21.2h16"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m15.6 15.6 4.2 4.2"/></symbol>

<template id="tpl-walk">
<p class="drop">The intersection of Bellamy and Dockwell is, by any ordinary measure, a failure. It has four lanes in each direction, a refuge island the width of a filing cabinet, and a signal cycle that gives people on foot nineteen seconds to cross eighty-four feet of asphalt. Nobody designed it to be hostile. That is the uncomfortable part.</p>
<p>I have spent two years reading the minutes. What they record is not malice but a quiet accumulation of locally reasonable decisions: a turning radius widened for a fire truck that comes twice a year, a crossing removed because the count of pedestrians using it was low, a lane added because a model said delay would otherwise rise in 2041.</p>
<h2>The arithmetic of a crossing</h2>
<p>Traffic engineering has a number for almost everything, and the numbers are mostly honest. The trouble is which quantities get counted. Vehicle delay is reported to two decimal places. Pedestrian delay is measured, when it is measured at all, as a letter grade nobody signs off on.</p>
<p>So the asymmetry is not ideological. It is clerical. <mark class="hl" data-id="h1" data-c="yellow" data-note="1">A street that cannot be crossed on foot is not a street; it is a wall with traffic on it.</mark> The wall is invisible in the analysis because walls are not in the units.</p>
<p>Ask what the counts were and you find the second trap. Pedestrian volumes are counted where people currently walk. If a crossing is unpleasant, few people use it; if few use it, the count is low; if the count is low, the crossing becomes a candidate for removal.</p>
<h2>What the curb remembers</h2>
<p>Streets keep records in their geometry. The tight corners of a pre-war grid were cut for carts and for people stepping off a curb without ceremony. The long sweeping curves of the postwar arterial were cut for a design vehicle: a notional truck, modelled, that must never slow down.</p>
<blockquote>The design vehicle is not a truck. It is a decision about who the street is willing to inconvenience.</blockquote>
<p>Once poured, concrete is an argument that is difficult to reopen. A signal timing plan can change on a Tuesday afternoon. A curb radius requires a capital project, a budget line, three rounds of consultation and a reason that is not simply "this is unpleasant." Comfort does not have a funding stream.</p>
<h2>A street, eventually</h2>
<p>I went back in March. The fourth crossing is still missing, but the cycle has quietly dropped to ninety seconds because a technician retimed the corridor and nobody objected. The difference is legible on the sidewalk: people stand nearer the curb, lean less, look up more.</p>
<p>Most of the city will be repaired this way, if it is repaired at all — not by master plans but by a long sequence of people deciding, inside the ordinary bounds of their job, to count a different thing.</p>
</template>

<template id="tpl-feed">
<p class="drop">There is a particular quality to the tiredness that follows an hour of scrolling, and it is not the tiredness of having read. Reading leaves residue. The feed leaves a kind of polished blankness.</p>
<h2>The shape of the thing</h2>
<p>A feed has no end, and that is usually described as its defining feature. The more important property is that it has no shape. A magazine has a back cover. A book has a weight in the hand that tells you how much is left.</p>
<p><mark class="hl" data-id="h2" data-c="blush">The feed does not steal your attention. It rents it back to you, hourly.</mark> You are never denied the thing you came for. You are simply never told that you have finished.</p>
<h2>Against the infinite</h2>
<p>The alternative is not asceticism. It is edges — a reading queue with a visible bottom, a newsletter that arrives on Thursdays, a stack that can in principle be emptied. Finishing is a design feature, and we removed it on purpose.</p>
</template>

    .map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("");

/* ============================================================ highlights */
function renderHighlights(){
  const q = S.hq.toLowerCase();
  const list = S.highlights.filter(h=>{
    if(S.hlFilter && h.color!==S.hlFilter) return false;
    if(!q) return true;
    const it=item(h.item);
    return (h.text+" "+h.note+" "+(it?it.title+" "+it.author:"")).toLowerCase().includes(q);
  });
  $("#mHQ").value = S.hq;
  $("#mHChips").innerHTML = Object.keys(COLORS).map(c=>
    `<button class="chip" data-hcolor="${c}" aria-pressed="${S.hlFilter===c}">
      <span class="swatch" style="background:var(--hl-${c})"></span>${COLORS[c]}</button>`).join("");
  $("#mHList").innerHTML = list.length ? list.map(hcardHTML).join("")
    : `<div class="empty">${ico("hl","mark ico")}<h2>No highlights match</h2>
       <p>Clear the filter, or open something and mark a passage.</p>
       <button class="btn" data-act="clear-hl">Clear filter</button></div>`;
}

/* ============================================================ search */
function renderSearch(){
  const q = S.gq.trim().toLowerCase();
  $("#mGQ").value = S.gq;
  const host = $("#mGRes");
  if(!q){ host.innerHTML = `<div class="empty" style="border:0">${ico("search","mark ico")}
    <h2>Search everything</h2><p>Titles, authors, document text, highlights, and your notes.</p></div>`; return; }
  const body = i => { const t=i.body?$("#"+i.body):null; return t?t.textContent.replace(/\s+/g," ").trim():i.excerpt; };
  const docs = S.items.filter(i=>(i.title+" "+i.author+" "+i.pub).toLowerCase().includes(q));
  const text = S.items.filter(i=>!docs.includes(i) && body(i).toLowerCase().includes(q));
  const hls = S.highlights.filter(h=>(h.text+" "+h.note).toLowerCase().includes(q));
  if(!docs.length && !text.length && !hls.length){
    host.innerHTML = `<div class="empty">${ico("search","mark ico")}<h2>No results for “${esc(S.gq)}”</h2>
      <p>Nothing in titles, text, highlights, or notes. Try a single word.</p>
      <button class="btn" data-act="clear-search">Clear search</button></div>`; return;
  }
  const snip = t => { const i=t.toLowerCase().indexOf(q); if(i<0) return esc(t.slice(0,110));
    const s=Math.max(0,i-40); return (s>0?"… ":"")+esc(t.slice(s,i))+"<strong>"+esc(t.slice(i,i+q.length))+"</strong>"+esc(t.slice(i+q.length,i+q.length+70))+" …"; };
  const grp = (label,n,inner)=> n?`<section class="sec"><div class="sec-head"><h2>${label} · ${n}</h2></div>${inner}</section>`:"";
  host.innerHTML =
    grp("Documents", docs.length, docs.map(itemHTML).join("")) +
    grp("In document text", text.length, text.map(i=>`<button class="hcard" data-open="${i.id}">
      <q style="font-size:15px">${snip(body(i))}</q>
      <span class="src">${ico("doc","ico sm")}${esc(i.title)}</span></button>`).join("")) +
    grp("Highlights", hls.length, hls.map(hcardHTML).join(""));
}

    <div class="empty" style="text-align:left;padding:22px">${ico("alert","mark ico")}
      <h2>Full text not included</h2><p style="max-width:none">This document's body isn't part of the sample data. Highlighting is wired on the two articles that are.</p></div>`;
  $("#readBody").innerHTML = `

      style="--read-size:${S.reader.size}px;--read-lead:${S.reader.lead}">

        <span class="caps">${TYPE_LABEL[i.type]} · ${mlabel(i.mins)}</span>
        <h1>${esc(i.title)}</h1>

        <button class="btn wide" data-act="back">Back to library</button>
      </div>
    </article>`;
  applyRuntime();
  updateProgress();
  if(opts.hl) requestAnimationFrame(()=>jumpTo(opts.hl));
}
function applyRuntime(){
  const root=$("#articleBody"); if(!root) return;
  S.highlights.filter(h=>h.item===S.readId).forEach(h=>{
    let mk = root.querySelector(`mark.hl[data-id="${h.id}"]`);
    if(!mk && h.created){
      const b = [...root.querySelectorAll("p,blockquote")].find(p=>p.textContent.includes(h.text) && !p.querySelector("mark.hl"));
      if(b){ b.innerHTML = b.innerHTML.replace(esc(h.text), `<mark class="hl" data-id="${h.id}" data-c="${h.color}">${esc(h.text)}</mark>`);
        mk = root.querySelector(`mark.hl[data-id="${h.id}"]`); }
    }
    if(mk){ mk.dataset.c=h.color; h.note?mk.setAttribute("data-note","1"):mk.removeAttribute("data-note"); }
  });
}
function updateProgress(){
  if(S.screen!=="reader") return;
  const sc=$("#scroller"), max=sc.scrollHeight-sc.clientHeight;
  const pct = max>0 ? Math.min(100, Math.round(sc.scrollTop/max*100)) : 0;
  $("#readProg").style.width = pct+"%";
  const i=item(S.readId);
  if(i && i.body && pct>i.progress){ i.progress=pct; if(i.status==="inbox") i.status="reading"; }
}
function jumpTo(id){
  const mk=$(`mark.hl[data-id="${id}"]`); if(!mk) return;
  const sc=$("#scroller"), r=mk.getBoundingClientRect(), sr=sc.getBoundingClientRect();
  sc.scrollTop += r.top - sr.top - sc.clientHeight*0.3;
  mk.classList.remove("flash"); void mk.offsetWidth; mk.classList.add("flash");
}

function doFetch(){
  const el=$("#aUrl"); ADD.url=(el?el.value:ADD.url).trim().replace(/^https?:\/\//,"");
  if(!ADD.url){ snack("Paste an address first"); return; }
  const dup = S.items.find(i=>i.url && i.url.toLowerCase()===ADD.url.toLowerCase());
  ADD.phase="loading"; sheetAdd();
  setTimeout(()=>{
    if(dup){ ADD.phase="dup"; ADD.dupId=dup.id; }
    else if(/paywall|locked/i.test(ADD.url)) ADD.phase="error";
    else { ADD.data = FETCHABLE[ADD.url.toLowerCase()] || infer(ADD.url); ADD.phase="ready"; }
    sheetAdd();
  }, 1000);
}
function infer(u){
  const host=u.split("/")[0]||"unknown.example";
  const slug=(u.split("/").slice(1).join(" ")||"Saved page").replace(/[-_]+/g," ");
  const pub=host.split(".")[0].replace(/^\w/,c=>c.toUpperCase());
  return {title:slug.replace(/\b\w/g,c=>c.toUpperCase()), author:"Unknown author", pub, mono:pub.slice(0,2).toUpperCase(),
    type:"article", mins:9, excerpt:"Preview built from the page itself. You can edit the author after saving."};
}
function saveAdd(linkOnly){
  if(ADD.tab==="note"){
    const t=($("#nTitle")?.value||"").trim()||"Untitled note";
    const b=($("#nBody")?.value||"").trim()||"No body yet.";
    S.items.unshift({id:S.nextId++,title:t,author:"Nadia Albrecht",pub:"Personal note",mono:"NA",type:"note",
      mins:1,saved:"Today",progress:0,status:"inbox",fav:false,coll:"",tags:[],url:"",excerpt:b});
    closeSheet(); snack("Note saved to Inbox"); S.filter="inbox"; go("library"); return;
  }
  if(ADD.phase!=="ready" && !linkOnly){ snack("Fetch a preview first"); return; }
  const d = linkOnly ? {...infer(ADD.url), excerpt:"Link saved without a readable copy."} : ADD.data;
  if(!d) return;
  const cid = $("#aColl")?.value || "";
  S.items.unshift({id:S.nextId++,title:d.title,author:d.author,pub:d.pub,mono:d.mono,type:d.type,mins:d.mins,
    saved:"Today",progress:0,status:"inbox",fav:false,coll:cid,tags:[],url:ADD.url,excerpt:d.excerpt});
  const newId = S.items[0].id;
  closeSheet();
  snack(`Saved to ${cid?`Inbox and ${coll(cid).name}`:"Inbox"}`, {label:"Read", fn:()=>go("reader",{id:newId})});
  S.filter="inbox"; go("library");
}

/* ============================================================ events */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab],[data-open],[data-act],[data-hl],[data-gohl],[data-filter],[data-hcolor],[data-coll],[data-clearcoll],[data-q],[data-rfont],[data-settheme],[data-addtab],[data-paste],[data-fetch],[data-save],[data-savelink],[data-retry],[data-opendup],[data-filepick],[data-nc],[data-savenote],[data-delhl],[data-noop]");
  if(!t){
    if(e.target.id==="veil"){ closeSheet(); return; }
    const mk = e.target.closest("mark.hl");
    if(mk){ const h=S.highlights.find(x=>x.id===mk.dataset.id); if(h) sheetNote(h.id); }
    return;
  }
  const d = t.dataset;
  if(d.noop!==undefined){ e.preventDefault(); snack("Opening the original source is out of scope for this prototype"); return; }
  e.preventDefault();

  if(d.tab){ go(d.tab); return; }
  if(d.open){ go("reader",{id:+d.open}); return; }
  if(d.hl){ const h=S.highlights.find(x=>x.id===d.hl); if(h) go("reader",{id:h.item, hl:h.id}); return; }
  if(d.gohl){ closeSheet(); const h=S.highlights.find(x=>x.id===d.gohl); jumpTo(d.gohl); if(h&&!h.note) setTimeout(()=>sheetNote(h.id),380); return; }
  if(d.filter){ S.filter=d.filter; closeSheet(); if(S.screen!=="library") go("library"); else renderLibrary(); return; }
  if(d.hcolor){ S.hlFilter = S.hlFilter===d.hcolor?null:d.hcolor; renderHighlights(); return; }
  if(d.coll){ S.collFilter=d.coll; S.q=""; S.filter="all"; go("library"); return; }
  if(d.clearcoll!==undefined){ S.collFilter=null; renderLibrary(); return; }
  if(d.q){ S.gq=d.q; renderSearch(); return; }

  if(d.rfont){ S.reader.font=d.rfont; const a=$("#articleBody"); if(a) a.dataset.font=d.rfont;
    $$("[data-rfont]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.rfont===d.rfont))); return; }
  if(d.settheme){ setTheme(d.settheme); sheetDisplay(); return; }

  if(d.addtab){ ADD.tab=d.addtab; ADD.phase="idle"; sheetAdd(); return; }
  if(d.paste){ ADD.url=d.paste; const el=$("#aUrl"); if(el) el.value=d.paste; doFetch(); return; }
  if(d.fetch!==undefined){ doFetch(); return; }
  if(d.retry!==undefined){ ADD.phase="idle"; sheetAdd(); setTimeout(doFetch,80); return; }
  if(d.savelink!==undefined){ saveAdd(true); return; }
  if(d.save!==undefined){ saveAdd(false); return; }
  if(d.opendup){ closeSheet(); go("reader",{id:+d.opendup}); return; }
  if(d.filepick!==undefined){ snack("File picking is out of scope for this prototype"); return; }

  if(d.nc){
    const id = $("#sheet [data-savenote]").dataset.savenote;
    const h = S.highlights.find(x=>x.id===id); h.color=d.nc;
    applyRuntime(); sheetNote(id); return;
  }
  if(d.savenote){
    const h = S.highlights.find(x=>x.id===d.savenote);
    h.note = $("#nText").value.trim();
    closeSheet(); applyRuntime();
    snack(h.note?"Note attached":"Highlight updated", {label:"See all", fn:()=>go("highlights")});
    return;
  }
  if(d.delhl){
    S.highlights = S.highlights.filter(x=>x.id!==d.delhl);
    const mk=$(`mark.hl[data-id="${d.delhl}"]`); if(mk) mk.replaceWith(document.createTextNode(mk.textContent));
    closeSheet(); snack("Highlight removed"); return;
  }

  switch(d.act){
    case "theme": setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"); renderHome(); break;
    case "back": go(S.prev==="reader"?"library":S.prev); break;
    case "close": closeSheet(); break;
    case "sheet-add": ADD={tab:"url",phase:"idle",url:"",data:null,dupId:null}; sheetAdd(); break;
    case "sheet-display": sheetDisplay(); break;
    case "sheet-notes": sheetNotes(); break;
    case "sheet-filter": sheetFilter(); break;
    case "clear-hl": S.hlFilter=null; renderHighlights(); break;
    case "clear-search": S.gq=""; renderSearch(); break;
    case "archive": {
      const i=item(S.readId); const prev={status:i.status, progress:i.progress};
      i.status="archived"; if(i.progress<100) i.progress=100;
      renderReader({keepScroll:true});
      snack(`“${i.title}” archived`, {label:"Undo", fn(){ i.status=prev.status; i.progress=prev.progress;
        renderReader({keepScroll:true}); snack("Put back"); }});
      break;
    }
  }
});
$("#mFav").addEventListener("click", ()=>{
  const i=item(S.readId); i.fav=!i.fav;
  $("#mFav").setAttribute("aria-pressed", String(i.fav)); $("#mFav").classList.toggle("on", i.fav);
  snack(i.fav?"Added to favorites":"Removed from favorites");
});
$("#mQ").addEventListener("input", e=>{ S.q=e.target.value; renderLibrary(); });
$("#mHQ").addEventListener("input", e=>{ S.hq=e.target.value; renderHighlights(); });
$("#mGQ").addEventListener("input", e=>{ S.gq=e.target.value; renderSearch(); });
document.addEventListener("input", e=>{
  const a=$("#articleBody");
  if(e.target.matches("[data-rsize]")){ S.reader.size=+e.target.value;
    if(a) a.style.setProperty("--read-size", S.reader.size+"px");
    const v=$('[data-v="size"]'); if(v) v.textContent=S.reader.size+"px"; }
  if(e.target.matches("[data-rlead]")){ S.reader.lead=+e.target.value;
    if(a) a.style.setProperty("--read-lead", S.reader.lead);
    const v=$('[data-v="lead"]'); if(v) v.textContent=S.reader.lead.toFixed(2); }
});

/* scroll: progress + auto-hiding reader bar */
let lastTop = 0;
$("#scroller").addEventListener("scroll", ()=>{
  updateProgress();
  $("#selTool").hidden = true;
  const top = $("#scroller").scrollTop;
  if(S.screen==="reader"){
    const bar=$("#readTop");
    if(top > lastTop + 6 && top > 140) bar.classList.add("hide");
    else if(top < lastTop - 6) bar.classList.remove("hide");
  }
  lastTop = top;
}, {passive:true});

/* selection toolbar */
function showSelTool(){
  const sel=window.getSelection(), body=$("#articleBody");
  if(S.screen!=="reader" || !sel || sel.isCollapsed || !body || !body.contains(sel.anchorNode)){ $("#selTool").hidden=true; return; }
  const txt=sel.toString().trim();
  if(txt.length<3){ $("#selTool").hidden=true; return; }
  const tool=$("#selTool");
  tool.innerHTML = `<button data-mk="yellow">${ico("hl","ico sm")}Highlight</button>
    <span class="dots">${Object.keys(COLORS).map(c=>`<button data-mk="${c}" style="background:var(--hl-${c})" aria-label="Highlight in ${COLORS[c]}"></button>`).join("")}</span>
    <span class="sepv"></span>
    <button data-mknote="1">${ico("note","ico sm")}Note</button>
    <button data-mkcopy="1">${ico("copy","ico sm")}Copy</button>`;
  tool.hidden=false;
  const r=sel.getRangeAt(0).getBoundingClientRect();
  const pr=$(".phone").getBoundingClientRect();
  const w=tool.offsetWidth, h=tool.offsetHeight;
  let left = r.left - pr.left + r.width/2 - w/2;
  left = Math.max(10, Math.min(left, pr.width - w - 10));
  let top = r.top - pr.top - h - 10;
  if(top < 58) top = r.bottom - pr.top + 10;
  tool.style.left=left+"px"; tool.style.top=top+"px";
}
document.addEventListener("mouseup", e=>{ if(e.target.closest(".seltool,.sheet")) return; setTimeout(showSelTool,10); });
document.addEventListener("touchend", e=>{ if(e.target.closest(".seltool,.sheet")) return; setTimeout(showSelTool,180); });
$("#selTool").addEventListener("mousedown", e=>e.preventDefault());
$("#selTool").addEventListener("click", e=>{
  const b=e.target.closest("[data-mk],[data-mknote],[data-mkcopy]"); if(!b) return;
  const sel=window.getSelection();
  if(b.dataset.mkcopy!==undefined){ navigator.clipboard?.writeText(sel.toString()).catch(()=>{});
    $("#selTool").hidden=true; snack("Passage copied"); return; }
  if(!sel || sel.isCollapsed) return;
  const text=sel.toString().trim();
  const id="r"+(S.nextId++);
  const mk=document.createElement("mark"); mk.className="hl"; mk.dataset.id=id;
  mk.dataset.c = b.dataset.mknote!==undefined ? "yellow" : b.dataset.mk;
  const r=sel.getRangeAt(0);
  try{ r.surroundContents(mk); }catch(err){ mk.appendChild(r.extractContents()); r.insertNode(mk); }
  sel.removeAllRanges();
  S.highlights.unshift({id, item:S.readId, color:mk.dataset.c, text, note:"", tags:[], created:true});
  $("#selTool").hidden=true;
  if(b.dataset.mknote!==undefined) sheetNote(id);
  else snack("Highlighted", {label:"Add a note", fn:()=>sheetNote(id)});
});

/* clock + boot */
function tick(){ $("#clock").textContent = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }
function boot(){
  try{ const th=localStorage.getItem("libra-m:theme"); if(th) document.documentElement.dataset.theme=th; }catch(e){}
  let saved=null; try{ saved=JSON.parse(localStorage.getItem("libra-m:nav")||"null"); }catch(e){}
  if(saved && saved.id) S.readId = saved.id;
  tick(); setInterval(tick, 20000);
  go(saved && saved.screen ? saved.screen : "home");
}
boot();
</script>
</body>
</html>
